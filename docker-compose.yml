services:
  mysql:
    image: mysql:8.0
    container_name: fuelpass-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Missing MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fuelpass}
      MYSQL_USER: ${MYSQL_USER:-fueluser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - fuelpass-network
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fuelpass-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5050
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-fueluser}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE:-fuelpass}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:?Missing JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER:?ADMIN_USER is required}
      ADMIN_PASS: ${ADMIN_PASS:?ADMIN_PASS is required}
      QR_SECRET: ${QR_SECRET:?Missing QR_SECRET}
      EMAIL_USER: ${EMAIL_USER:?Missing EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS:?Missing EMAIL_PASS}
      ALLOWED_ORIGINS: http://3.25.207.68
    ports:
      - "127.0.0.1:5050:5050"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fuelpass-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://3.25.207.68
    container_name: fuelpass-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fuelpass-network

volumes:
  mysql_data:
    driver: local

networks:
  fuelpass-network:
    driver: bridge
